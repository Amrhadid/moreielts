name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate authored forms
        run: npm run seed:validate
      - name: Build (also generates the route tree)
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm run typecheck
      - run: npm test
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          npx wait-on -t 60000 http://localhost:4173
          BASE_URL=http://localhost:4173 npm run test:e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seed and RLS suites
        run: |
          out=$(bash scripts/test-db.sh)
          echo "$out"
          echo "$out" | grep -q "ALL RLS TESTS PASSED"
          echo "$out" | grep -q "ALL PRACTICE TESTS PASSED"

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          echo '{"nodeModulesDir":"auto"}' > /tmp/deno.json
          deno check --no-lock --config /tmp/deno.json supabase/functions/*/index.ts
